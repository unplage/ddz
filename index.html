        document.getElementById('connStatus').classList.add('hidden');
        document.getElementById('emojiBtn').classList.add('hidden');
        GameState.stats.total++;
        initGame();
    }

    function dealCards() {
        if (dealInterval) clearInterval(dealInterval);
        let count = 0;
        dealInterval = setInterval(()=>{
            if (count < 51) {
                let idx = count % 3, card = GameState.deck.pop();
                GameState.players[idx].push(card);
                if (idx === GameState.myIndex && count % 3 === 0) playSound('deal');
                if (idx === GameState.myIndex) renderPlayerHand(); else updateOpponentCount(idx);
                count++;
            } else { 
                clearInterval(dealInterval);
                dealInterval = null;
                GameState.lordCards = GameState.deck.slice(0,3); 
                GameState.players[0].sort((a,b)=>a.value-b.value);
                GameState.players[1].sort((a,b)=>a.value-b.value);
                GameState.players[2].sort((a,b)=>a.value-b.value);
                trackTimeout(startCallPhase, 500);
            }
        }, 30);
    }

    // ======================== 叫分阶段 ========================
    function startCallPhase() {
        GameState.phase = 'calling';
        GameState.currentPlayer = Math.floor(Math.random() * 3);
        GameState.callScores = [0,0,0];
        if (GameState.mode === 'single') processSingleCall();
        else { broadcastFullState(); processOnlineCallTurn(); }
    }

    function processSingleCall() {
        if (GameState.phase !== 'calling') return;
        let id = GameState.currentPlayer;
        updateCallStatusText(id);
        updateCallBtns();
        if (id === GameState.myIndex) {
            startOnlineTimer(10, () => { if (GameState.phase === 'calling' && GameState.currentPlayer === GameState.myIndex) callScore(0); }, GameState.myIndex);
            return;
        }
        startOnlineTimer(2, null, id);
        trackTimeout(() => {
            let ai = GameState.aiList[id];
            let score = ai.think('call', GameState);
            callScore(score);
        }, 1000);
    }

    function updateCallBtns() {
        if (GameState.mode === 'online') return;
        let isPlayer = (GameState.currentPlayer === GameState.myIndex);
        ['callBtn','oneBtn','twoBtn','threeBtn'].forEach(id=>{ let btn=document.getElementById(id); if(btn) btn.style.display = isPlayer ? 'flex' : 'none'; });
        if (isPlayer) {
            document.getElementById('oneBtn').disabled = (GameState.baseScore >= 1);
            document.getElementById('twoBtn').disabled = (GameState.baseScore >= 2);
            document.getElementById('threeBtn').disabled = (GameState.baseScore >= 3);
        }
    }

    let singleCallCount = 0;
    function callScore(score) {
        if (GameState.phase !== 'calling') return;
        clearTimer();
        if (GameState.mode === 'online') {
            sendAction({ type: 'call', score });
            return;
        }
        let id = GameState.currentPlayer;
        singleCallCount++;
        GameState.callScores[id] = score;
        if (score === 0) showToast(getPlayerName(id)+' 不叫');
        else { GameState.baseScore = Math.max(GameState.baseScore, score); GameState.landlord = id; document.getElementById('scoreDisplay').textContent = '底分: '+GameState.baseScore; showToast(getPlayerName(id)+' '+score+'分'); }
        if (score === 3) trackTimeout(becomeLandlord, 500);
        else if (singleCallCount >= 3) {
            if (GameState.landlord >= 0) trackTimeout(becomeLandlord, 500);
            else { showToast("无人叫地主，重新发牌"); trackTimeout(()=>{ initGame(); }, 500); }
        }
        else { GameState.currentPlayer = (id+1)%3; trackTimeout(processSingleCall, 500); }
    }

    // ======================== 成为地主 ========================
    function becomeLandlord() {
        let lordIdx = GameState.landlord;
        if (lordIdx < 0) { showToast("无人叫地主，重新发牌"); initGame(); return; }
        GameState.players[lordIdx].push(...GameState.lordCards);
        GameState.players[lordIdx].sort((a,b)=>a.value-b.value);
        showToast(getPlayerName(lordIdx)+' 成为地主！');
        if (lordIdx === GameState.myIndex) renderPlayerHand(); else updateOpponentCount(lordIdx);
        document.getElementById('controls').innerHTML =
            '<button id="playBtn" class="pixel-btn bg-green-500 min-w-[80px]" onclick="playCards()">出牌</button>' +
            '<button id="passBtn" class="pixel-btn bg-gray-500 min-w-[80px]" onclick="passTurn()">不出</button>' +
            '<button class="pixel-btn bg-blue-500 text-[10px]" onclick="showHint()">提示</button>';
        GameState.phase = 'playing';
        GameState.currentPlayer = lordIdx;
        GameState.firstPlayMade = false; GameState.lordPlayCount = 0; GameState.farmerPlayed = false;
        GameState.passCount = 0;
        GameState.processing = false;
        
        showLordCards();
        
        if (GameState.mode === 'single') trackTimeout(processPlayPhase, 3000);
        else { broadcastFullState(); trackTimeout(processPlayPhase, 3000); }
    }

    function showLordCards() {
        if (!GameState.lordCards || GameState.lordCards.length === 0) return;
        const area = document.getElementById('playArea');
        area.innerHTML = '';
        GameState.lordCards.forEach(card => {
            let div = document.createElement('div');
            div.className = `card lord-card w-8 h-11 bg-yellow-100 border-2 border-red-600 rounded flex flex-col items-center justify-center text-[8px] ${card.suit==='♥'||card.suit==='♦'||card.suit==='JOKER'?'text-red-500':'text-black'}`;
            if (card.suit === 'JOKER') {
                div.innerHTML = `<span>${card.rank[0]}</span>`;
            } else {
                div.innerHTML = `<span>${card.suit}</span><span>${card.rank}</span>`;
            }
            area.appendChild(div);
        });
        document.getElementById('lastPlayer').textContent = '底牌揭晓！';
        bottomCardsShown = true;
    }

    // ======================== 出牌阶段 ========================
    function getAIDelay() { if (aiSpeed === 'fast') return 300; if (aiSpeed === 'slow') return 1200; return 700; }

    function processPlayPhase() {
        if (GameState.phase !== 'playing') return;
        if (GameState.processing) return;
        let id = GameState.currentPlayer;
        if (GameState.lastPlayerId !== -1 && GameState.players[GameState.lastPlayerId].length === 0) { endGame(GameState.lastPlayerId); return; }
        if (GameState.passCount === 2) {
            GameState.lastPlay = null; GameState.lastPlayerId = -1;
            document.getElementById('playArea').innerHTML = '<span class="text-gray-500 text-[10px]">自由出牌</span>';
            GameState.passCount = 0;
            bottomCardsShown = false;
        }
        if (GameState.mode === 'online') {
            processOnlinePlay(id);
            return;
        }
        processSinglePlay(id);
    }

    function processSinglePlay(id) {
        updatePlayStatusText(id);
        let playBtn = document.getElementById('playBtn'), passBtn = document.getElementById('passBtn');
        if (id === GameState.myIndex) {
            if (playBtn) playBtn.disabled = (GameState.selectedCards.size === 0);
            if (passBtn) passBtn.disabled = (!GameState.lastPlay || GameState.lastPlayerId === GameState.myIndex);
            startOnlineTimer(15, () => {
                if (GameState.phase === 'playing' && GameState.currentPlayer === GameState.myIndex) {
                    if (GameState.lastPlay && GameState.lastPlayerId !== GameState.myIndex) passTurn();
                    else {
                        let hand = GameState.players[GameState.myIndex];
                        if (hand && hand.length > 0) { GameState.selectedCards.clear(); GameState.selectedCards.add(hand[0]); playCards(); }
                    }
                }
            }, GameState.myIndex);
        } else {
            if (playBtn) playBtn.disabled = true; if (passBtn) passBtn.disabled = true;
            GameState.processing = true;
            let delay = getAIDelay();
            let thinkingTime = GameState.difficulty === 'legendary' ? 8 :
                GameState.difficulty === 'grandmaster' ? 6 :
                GameState.difficulty === 'hard' ? 5 : 3;
            startOnlineTimer(thinkingTime, () => {
                if (GameState.processing && GameState.currentPlayer === id) {
                    showToast(getPlayerName(id)+' 思考超时');
                    executePlayCards(id, []);
                    GameState.processing = false;
                }
            }, id);
            
            trackTimeout(() => {
                if (GameState.currentPlayer !== id || GameState.phase !== 'playing') return;
                let ai = GameState.aiList[id];
                let cards = ai.think('play', GameState);
                if (cards && cards.length > 0) {
                    let isValid = cards.every(c => GameState.players[id].some(hc => hc.id === c.id));
                    let typeValid = getCardType(cards) !== null;
                    if (!isValid || !typeValid) cards = [];
                }
                executePlayCards(id, cards || []);
                GameState.processing = false;
            }, delay);
        }
    }

    function describePlay(cards) {
        if (!cards || cards.length === 0) return '不出';
        let type = getCardType(cards);
        if (!type) return '不出';
        const vn = (v) => { if (v<=7) return (v+3); if (v===8) return 'J'; if (v===9) return 'Q'; if (v===10) return 'K'; if (v===11) return 'A'; if (v===12) return '2'; if (v===13) return '小王'; if (v===14) return '大王'; return '?'; };
        switch (type.type) {
            case 'single': return '单张'+vn(type.value);
            case 'pair': return '对'+vn(type.value);
            case 'triple': return '三张'+vn(type.value);
            case 'triple_single': {
                let cnt = countValues(cards.map(c=>c.value));
                let singleVal = parseInt(Object.keys(cnt).find(k=>cnt[k]===1));
                return '三带一'+vn(singleVal);
            }
            case 'triple_pair': {
                let cnt = countValues(cards.map(c=>c.value));
                let pairVal = parseInt(Object.keys(cnt).find(k=>cnt[k]===2));
                return '三带对'+vn(pairVal);
            }
            case 'straight': return '顺子';
            case 'straight_pair': return '连对';
            case 'four_two_single': return '四带二';
            case 'four_two_pair': return '四带两对';
            case 'bomb': return '💣炸弹';
            case 'rocket': return '🚀王炸';
            default: return '出牌';
        }
    }
    function updateActionLog(playerId, cards) {
        let name = getPlayerName(playerId);
        let desc = describePlay(cards);
        playLog.unshift({ player: name, action: desc });
        if (playLog.length > 3) playLog.pop();
        let el = document.getElementById('actionLog');
        if (el) el.textContent = playLog.map(a => a.player+': '+a.action).join(' | ');
    }

    function executePlayCards(player, cards) {
        clearTimer();
        updateActionLog(player, cards);
        let isPlay = (cards && cards.length > 0);
        if (!isPlay) {
            GameState.passCount++;
            if (GameState.mode === 'single') speakNow("过");
        } else {
            let type = getCardType(cards);
            if (!type) { showToast('牌型非法'); GameState.passCount++; GameState.currentPlayer = (player+1)%3; nextPlayStep(); return; }
            let playedIds = new Set(cards.map(c => c.id));
            GameState.players[player] = GameState.players[player].filter(c => !playedIds.has(c.id));
            GameState.lastPlay = type;
            GameState.lastPlayerId = player;
            GameState.passCount = 0;
            
            if (!GameState.firstPlayMade) GameState.firstPlayMade = true;
            if (player === GameState.landlord) GameState.lordPlayCount++;
            else GameState.farmerPlayed = true;
            
            if (type.type === CardType.BOMB || type.type === CardType.ROCKET) {
                GameState.bombCount++;
                GameState.baseScore *= 2;
                document.getElementById('scoreDisplay').textContent = '底分: '+GameState.baseScore;
                playSound('bomb');
                triggerBombFlash(); 
                addHistory(`💣 炸弹！倍数x2`);
            } else {
                playSound('play');
            }
            if (GameState.mode === 'single' && GameState.cardMemory) GameState.cardMemory.recordPlayerPlay(player, cards);
            displayPlayed(cards);
            speakPlay(cards);
            
            if (player === GameState.myIndex) renderPlayerHand();
            else updateOpponentCount(player);
            
            if (GameState.players[player].length === 0) { endGame(player); return; }
            if (GameState.players[player].length <= 3) showToast(getPlayerName(player)+' 剩'+GameState.players[player].length+'张！');
        }
        GameState.currentPlayer = (player+1)%3;
        nextPlayStep();
    }

    function triggerBombFlash() {
        const area = document.getElementById('playArea');
        area.classList.add('spring-flash');
        trackTimeout(() => area.classList.remove('spring-flash'), 400);
    }

    function nextPlayStep() {
        if (GameState.mode === 'online') broadcastFullState();
        trackTimeout(processPlayPhase, 600);
    }

    function displayPlayed(cards) {
        const area = document.getElementById('playArea'); area.innerHTML = '';
        cards.forEach(card => {
            let div = document.createElement('div');
            div.className = `w-8 h-11 bg-white border-2 border-black rounded flex flex-col items-center justify-center text-[8px] ${card.suit==='♥'||card.suit==='♦'||card.suit==='JOKER'?'text-red-500':'text-black'}`;
            if (card.suit === 'JOKER') { div.innerHTML = `<span>${card.rank[0]}</span>`; div.className += ' bg-yellow-50'; }
            else div.innerHTML = `<span>${card.suit}</span><span>${card.rank}</span>`;
            area.appendChild(div);
        });
        bottomCardsShown = false;
        document.getElementById('lastPlayer').textContent = '';
    }

    // ======================== UI ========================
    let dragIndex = null;

    function enableDragSort() {
        if (GameState.mode === 'online') return;
        const cards = document.querySelectorAll('#playerHand .card');
        cards.forEach((card, idx) => {
            card.setAttribute('draggable', 'true');
            card.ondragstart = (e) => { dragIndex = idx; e.dataTransfer.setData('text/plain', idx); e.target.classList.add('dragging'); };
            card.ondragend = (e) => { e.target.classList.remove('dragging'); dragIndex = null; };
            card.ondragover = (e) => { e.preventDefault(); };
            card.ondrop = (e) => {
                e.preventDefault();
                let targetIdx = idx;
                if (dragIndex !== null && dragIndex !== targetIdx) {
                    let hand = GameState.players[GameState.myIndex];
                    let [removed] = hand.splice(dragIndex, 1);
                    hand.splice(targetIdx, 0, removed);
                    renderPlayerHand();
                    enableDragSort();
                }
            };
        });
    }

    function renderPlayerHand() {
        const container = document.getElementById('playerHand'); container.innerHTML = '';
        let hand = GameState.players[GameState.myIndex] || [];
        if (hand.length === 0) return;
        let cards = hand, total = cards.length, row1Count = Math.ceil(total/2);
        let row1 = document.createElement('div'); row1.className = 'card-row';
        cards.slice(0,row1Count).forEach((card,idx)=>{ row1.appendChild(createCardElement(card,idx)); });
        container.appendChild(row1);
        if (total > row1Count) {
            let row2 = document.createElement('div'); row2.className = 'card-row second';
            cards.slice(row1Count).forEach((card,idx)=>{ row2.appendChild(createCardElement(card,row1Count+idx)); });
            container.appendChild(row2);
        }
        enableDragSort();
    }
    function createCardElement(card, index) {
        let div = document.createElement('div');
        div.className = `card ${GameState.selectedCards.has(card)?'selected':''}`;
        let isSmall = window.innerWidth <= 380;
        div.style.width = isSmall?'44px':(window.innerWidth<=768?'50px':'64px');
        div.style.height = isSmall?'62px':(window.innerWidth<=768?'70px':'90px');
        div.style.fontSize = isSmall?'10px':(window.innerWidth<=768?'12px':'14px');
        if (index > 0) div.style.marginLeft = isSmall?'-18px':(window.innerWidth<=768?'-20px':'-22px');
        let isRed = card.suit==='♥'||card.suit==='♦'||card.suit==='JOKER';
        div.className += isRed ? ' suit-red' : ' suit-black';
        if (card.suit === 'JOKER') { div.innerHTML = `<div class="font-bold text-center leading-tight" style="font-size:0.8em;">${card.rank}</div>`; if (card.rank==='大王') div.style.background = '#ffebee'; }
        else div.innerHTML = `<div class="font-bold text-center">${card.suit}</div><div class="font-bold text-center" style="font-size:0.9em;">${card.rank}</div>`;
        div.onclick = (e)=>{ e.preventDefault(); e.stopPropagation(); toggleCard(card.id); };
        return div;
    }
    function toggleCard(cardId) {
        if (audioEnabled) {
            if (!audioCtx) initAudio();
            else if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        if (GameState.phase !== 'playing' || GameState.currentPlayer !== GameState.myIndex || GameState.processing) return;
        let card = GameState.players[GameState.myIndex].find(c=>c.id===cardId);
        if (!card) return;
        if (GameState.selectedCards.has(card)) GameState.selectedCards.delete(card);
        else GameState.selectedCards.add(card);
        renderPlayerHand();
        let playBtn = document.getElementById('playBtn'); if (playBtn) playBtn.disabled = (GameState.selectedCards.size === 0);
        updateOnlinePreview();
    }
    function updateOnlinePreview() {
        if (GameState.mode !== 'online') return;
        let cards = Array.from(GameState.selectedCards);
        if (cards.length===0) { document.getElementById('previewPanel').innerText=''; return; }
        let type = getCardType(cards);
        document.getElementById('previewPanel').innerText = type ? `牌型: ${type.type}` : '无效牌型';
    }
    
    function updateOpponentCount(player) {
        if (player === GameState.myIndex) return;
        let leftIdx = (GameState.myIndex + 1) % 3;
        let rightIdx = (GameState.myIndex + 2) % 3;
        let count = GameState.players[player]?.length || 0;
        if (player === leftIdx) document.getElementById('leftCount').textContent = count;
        else if (player === rightIdx) document.getElementById('rightCount').textContent = count;
    }
    
    function updatePlayStatusText(currentPlayerId) {
        let myIdx = GameState.myIndex;
        let leftIdx = (myIdx + 1) % 3;
        let rightIdx = (myIdx + 2) % 3;
        
        let myText = '', leftText = '', rightText = '';
        if (currentPlayerId === myIdx) myText = GameState.landlord === myIdx ? '地主出牌' : '出牌';
        else if (currentPlayerId === leftIdx) leftText = '出牌...';
        else if (currentPlayerId === rightIdx) rightText = '出牌...';
        
        document.getElementById('playerStatus').textContent = myText;
        document.getElementById('leftStatus').textContent = leftText;
        document.getElementById('rightStatus').textContent = rightText;
    }

    function updateCallStatusText(currentPlayerId) {
        let myIdx = GameState.myIndex;
        let leftIdx = (myIdx + 1) % 3;
        let rightIdx = (myIdx + 2) % 3;
        
        document.getElementById('playerStatus').textContent = currentPlayerId === myIdx ? '你的回合 (10秒)' : '';
        document.getElementById('leftStatus').textContent = currentPlayerId === leftIdx ? '思考...' : '';
        document.getElementById('rightStatus').textContent = currentPlayerId === rightIdx ? '思考...' : '';
    }

    function formatRemainingCards(playerIdx) {
        let cards = GameState.players[playerIdx];
        if (!cards || cards.length === 0) return '已出完';
        let cnt = countValues(cards.map(c => c.value));
        let sorted = Object.keys(cnt).map(Number).sort((a, b) => a - b);
        return sorted.map(v => {
            let name = v <= 7 ? (v + 3).toString() : v === 8 ? 'J' : v === 9 ? 'Q' : v === 10 ? 'K' : v === 11 ? 'A' : v === 12 ? '2' : v === 13 ? '小王' : '大王';
            return cnt[v] > 1 ? name + 'x' + cnt[v] : name;
        }).join(' ');
    }

    function getPlayerName(idx) {
        if (idx === GameState.myIndex) return '你';
        if (idx === GameState.landlord) return '地主';
        let leftIdx = (GameState.myIndex + 1) % 3;
        if (idx === leftIdx) return '左农';
        return '右农';
    }

    function updateStats() { document.getElementById('coins').textContent = GameState.coins; }
    function showToast(msg) { let existing = document.querySelector('.toast'); if(existing) existing.remove(); let div = document.createElement('div'); div.className = 'toast'; div.textContent = msg; document.body.appendChild(div); trackTimeout(()=>div.remove(),2000); }
    function toggleRules() { document.getElementById('rulesModal').classList.toggle('hidden'); }
    function changeDifficulty(val) { GameState.difficulty = val; if(GameState.aiList[1]) { GameState.aiList[1].difficulty = val; GameState.aiList[2].difficulty = val; } }

    function playCards() {
        if (GameState.processing) { showToast('请等待AI思考...'); return; }
        if (GameState.phase !== 'playing' || GameState.currentPlayer !== GameState.myIndex) return;
        let cards = Array.from(GameState.selectedCards);
        if (cards.length === 0) { showToast('请选择牌'); return; }
        let type = getCardType(cards);
        if (!type) { showToast('无效的牌型'); document.getElementById('handContainer').classList.add('ani-shake'); trackTimeout(()=>document.getElementById('handContainer').classList.remove('ani-shake'),300); return; }
        if (!canBeat(type, GameState.lastPlay)) { showToast('需要大过上一手'); document.getElementById('handContainer').classList.add('ani-shake'); trackTimeout(()=>document.getElementById('handContainer').classList.remove('ani-shake'),300); return; }
        if (GameState.mode === 'online') {
            sendAction({ type: 'play', cards });
            let playBtn = document.getElementById('playBtn'); if (playBtn) playBtn.disabled = true;
            GameState.selectedCards.clear();
            renderPlayerHand();
        } else {
            executePlayCards(GameState.myIndex, cards);
            GameState.selectedCards.clear();
        }
    }
    function passTurn() {
        if (GameState.processing) { showToast('请等待AI思考...'); return; }
        if (GameState.phase !== 'playing' || GameState.currentPlayer !== GameState.myIndex) return;
        if (!GameState.lastPlay || GameState.lastPlayerId === GameState.myIndex) { showToast('你必须出牌'); return; }
        if (GameState.mode === 'online') sendAction({ type: 'pass' });
        else executePlayCards(GameState.myIndex, []);
    }
    function resetSelection() { GameState.selectedCards.clear(); renderPlayerHand(); let btn = document.getElementById('playBtn'); if(btn) btn.disabled = true; }
    function showHint() {
        if (GameState.phase !== 'playing' || GameState.currentPlayer !== GameState.myIndex) return;
        if (GameState.mode === 'online') { showToast("联机模式无AI提示"); return; }
        let plays = getAllValidPlays(GameState.players[GameState.myIndex], GameState.lastPlay);
        if (plays.length > 0) { GameState.selectedCards = new Set(plays[0]); renderPlayerHand(); showToast('已选推荐牌'); document.getElementById('playBtn').disabled = false; }
        else { if (GameState.lastPlay) showToast('建议：不出'); else showToast('请自由出牌'); }
    }

    // ======================== 联机模式 ========================
    function initPeer() {
        GameState.peer = new Peer();
        let peerConnected = false;
        let peerTimeout = trackTimeout(() => {
            if (!peerConnected) {
                showToast('连接超时，请检查网络');
                if (GameState.peer) { GameState.peer.destroy(); GameState.peer = null; }
            }
        }, 10000);
        GameState.peer.on('open', id => {
            peerConnected = true;
            clearTimeout(peerTimeout);
            document.getElementById('myPeerId').innerText = id;
            document.getElementById('connStatus').classList.remove('hidden');
            document.getElementById('connStatus').innerHTML = `📡 房间码:${id}`;
        });
        GameState.peer.on('connection', conn => {
            let idx = GameState.connections.length + 1;
            conn.playerIdx = idx;
            GameState.connections.push(conn);
            conn.on('data', d => onConnectionData(conn, d));
            conn.on('close', () => {
                let dcIdx = conn.playerIdx;
                GameState.connections = GameState.connections.filter(c => c !== conn);
                handleDisconnect(dcIdx);
            });
            if (GameState.connections.length === 2 && (!GameState.phase || GameState.phase === 'waiting' || GameState.phase === 'idle')) startOnlineGame();
        });
        GameState.peer.on('error', e => console.warn(e));
    }
    function joinGame() {
        let target = document.getElementById('targetPeerId').value.trim();
        if (!target) return;
        let conn = GameState.peer.connect(target);
        conn.on('open', () => {
            GameState.connections.push(conn);
            conn.on('data', d => onConnectionData(conn, d));
            GameState.myRole = 'client';
            GameState.hostPeerId = target;
            document.getElementById('connectPanel').style.display = 'none';
            document.getElementById('connStatus').innerHTML = '🔗 已连接房主';
            showToast("加入成功，等待房主开局");
        });
        conn.on('close', () => {
            showToast('房主已断开连接，返回菜单');
            trackTimeout(backToMenu, 2000);
        });
        conn.on('error', () => showToast("连接失败"));
    }
    function startOnlineGame() {
        initAudio();
        GameState.mode = 'online';
        GameState.myRole = 'host';
        GameState.myIndex = 0;
        document.getElementById('topRightControls').classList.add('hidden');
        document.getElementById('connStatus').classList.remove('hidden');
        document.getElementById('connStatus').innerHTML = '👑 房主';
        document.getElementById('emojiBtn').classList.remove('hidden');
        document.getElementById('connectPanel').style.display = 'none';
        document.getElementById('startScreen').classList.add('hidden');
        showToast("两人已满，游戏开始");
        GameState.stats.total++;
        initGame();
    }
    function copyPeerId() {
        let id = document.getElementById('myPeerId').innerText;
        if (id && id !== '生成中...') { navigator.clipboard.writeText(id); showToast('已复制房间码'); }
    }
    function sendEmoji(emoji) {
        let msg = { type:'emoji', from:GameState.myIndex, emoji };
        if (GameState.myRole === 'host') {
            for (let c of GameState.connections) c.send(msg);
        } else if (GameState.connections[0]) {
            GameState.connections[0].send(msg);
        }
        showToast(`你: ${emoji}`);
    }
    function onConnectionData(conn, data) {
        if (data.type === 'action') handleAction({ ...data.action, from: data.from });
        else if (data.type === 'sync' && GameState.myRole !== 'host') handleSync(data.state);
        else if (data.type === 'emoji') {
            showToast(`${getPlayerName(data.from)}: ${data.emoji}`);
            if (GameState.myRole === 'host') {
                GameState.connections.forEach(c => { if (c !== conn) c.send(data); });
            }
        }
    }

    function broadcastFullState() {
        if (GameState.myRole !== 'host') return;
        let base = {
            phase: GameState.phase, players: GameState.players.map(p=>[...p]),
            landlord: GameState.landlord, currentPlayer: GameState.currentPlayer,
            lastPlay: GameState.lastPlay, lastPlayerId: GameState.lastPlayerId,
            baseScore: GameState.baseScore, bombCount: GameState.bombCount,
            passCount: GameState.passCount, firstPlayMade: GameState.firstPlayMade,
            lordPlayCount: GameState.lordPlayCount, farmerPlayed: GameState.farmerPlayed,
            callScores: GameState.callScores, lordCards: GameState.lordCards,
            seq: ++GameState.stateSeq
        };
        GameState.connections.forEach((conn, i) => {
            let safeState = JSON.parse(JSON.stringify(base));
            safeState.players = base.players.map((p, idx) => {
                if (idx === i + 1) return [...p]; 
                return p.map(c => ({ suit: 'back', rank: '?', value: 0, id: 'back_' + Math.random().toString(36).substr(2, 9) }));
            });
            if (safeState.phase === 'calling') {
                safeState.lordCards = safeState.lordCards.map(c => ({ suit: 'back', rank: '?', value: 0, id: 'back' }));
            }
            conn.send({ type: 'sync', state: { ...safeState, myIndex: i + 1 } });
        });
    }
    function handleSync(state) {
        let prevPhase = GameState.phase;
        let prevLastPlay = GameState.lastPlay;
        let prevLastPlayerId = GameState.lastPlayerId;
        GameState.phase = state.phase;
        GameState.players = state.players.map(p=>[...p]);
        GameState.landlord = state.landlord;
        GameState.currentPlayer = state.currentPlayer;
        GameState.lastPlay = state.lastPlay;
        GameState.lastPlayerId = state.lastPlayerId;
        GameState.baseScore = state.baseScore;
        GameState.bombCount = state.bombCount;
        GameState.passCount = state.passCount;
        GameState.firstPlayMade = state.firstPlayMade;
        GameState.lordPlayCount = state.lordPlayCount;
        GameState.farmerPlayed = state.farmerPlayed;
        GameState.callScores = state.callScores || [0,0,0];
        GameState.lordCards = state.lordCards || [];
        GameState.myIndex = state.myIndex;
        GameState.selectedCards.clear();
        let hasPlay = state.lastPlay && state.lastPlay.cards && state.lastPlay.cards.length > 0;
        if (hasPlay) {
            let isNew = !prevLastPlay || !prevLastPlay.cards || prevLastPlay.cards.length === 0 || prevLastPlayerId !== state.lastPlayerId;
            if (isNew) {
                speakPlay(state.lastPlay.cards);
                if (state.lastPlay.type === CardType.BOMB || state.lastPlay.type === CardType.ROCKET) {
                    playSound('bomb');
                }
            }
        }
        renderUI();
        if (GameState.phase === 'calling') processOnlineCallTurn();
        else if (GameState.phase === 'playing') {
            if (prevPhase !== 'playing') {
                showLordCards(); // 修复: 进入出牌阶段时显示底牌
            }
            processOnlinePlay(GameState.currentPlayer);
        } else if (GameState.phase === 'gameover') {
            clearTimer();
            let isWin = false;
            if (GameState.landlord === GameState.myIndex) isWin = GameState.lastPlayerId === GameState.myIndex;
            else isWin = GameState.lastPlayerId !== GameState.landlord;
            let screen = document.getElementById('gameOverScreen'), title = document.getElementById('resultTitle'), content = document.getElementById('resultContent');
            let remainingHtml = '<div style="margin-top:8px;border-top:1px solid #555;padding-top:6px;font-size:10px;color:#aaa;text-align:left;">';
            for (let i = 0; i < 3; i++) {
                let name = getPlayerName(i);
                let role = i === GameState.landlord ? '(地主)' : '(农民)';
                let cards = formatRemainingCards(i);
                remainingHtml += name + role + ': ' + cards + '<br>';
            }
            remainingHtml += '</div>';
            if (isWin) {
                title.textContent = '🎉 胜利！'; title.className = 'text-xl retro-text mb-4 text-yellow-400 text-center';
                content.innerHTML = `对局结束${remainingHtml}`;
            } else {
                title.textContent = '💔 失败'; title.className = 'text-xl retro-text mb-4 text-gray-400 text-center';
                content.innerHTML = `对局结束${remainingHtml}`;
            }
            screen.classList.remove('hidden');
        }
    }

    function sendAction(action) {
        if (GameState.myRole === 'host') handleAction(action);
        else if (GameState.connections[0]) GameState.connections[0].send({ type: 'action', action, from: GameState.myIndex });
    }
    function handleAction(action) {
        let player = action.from !== undefined ? action.from : GameState.myIndex;
        if (action.type === 'call') executeCall(player, action.score);
        else if (action.type === 'play') executePlayCards(player, action.cards);
        else if (action.type === 'pass') executePlayCards(player, []);
    }

    function processOnlineCallTurn() {
        if (GameState.phase !== 'calling') return;
        let id = GameState.currentPlayer;
        updateCallStatusText(id);
        if (id === GameState.myIndex) {
            renderOnlineCallButtons();
            startOnlineTimer(10, () => { if (GameState.phase === 'calling' && GameState.currentPlayer === GameState.myIndex) makeCall(0); }, id);
        } else {
            document.getElementById('controls').innerHTML = '<button class="pixel-btn bg-gray-600" disabled>等待叫分</button>';
            startOnlineTimer(10, null, id);
        }
    }
    function renderOnlineCallButtons() {
        let btns = '<button class="pixel-btn bg-gray-500" onclick="makeCall(0)">不叫</button>';
        btns += (GameState.baseScore < 1) ? '<button class="pixel-btn bg-blue-500" onclick="makeCall(1)">1分</button>' : '<button class="pixel-btn bg-gray-600" disabled>1分</button>';
        btns += (GameState.baseScore < 2) ? '<button class="pixel-btn bg-yellow-500" onclick="makeCall(2)">2分</button>' : '<button class="pixel-btn bg-gray-600" disabled>2分</button>';
        btns += (GameState.baseScore < 3) ? '<button class="pixel-btn bg-red-500" onclick="makeCall(3)">3分</button>' : '<button class="pixel-btn bg-gray-600" disabled>3分</button>';
        document.getElementById('controls').innerHTML = btns;
    }
    function makeCall(score) {
        if (GameState.phase !== 'calling' || GameState.currentPlayer !== GameState.myIndex) return;
        clearTimer();
        sendAction({ type: 'call', score });
    }
    function executeCall(player, score) {
        if (score === 0) GameState.callScores[player] = -1;
        else { GameState.callScores[player] = score; GameState.baseScore = Math.max(GameState.baseScore, score); GameState.landlord = player; }
        let allFinished = GameState.callScores.every(s => s !== 0);
        if (score === 3 || allFinished) {
            if (GameState.landlord < 0) { showToast("无人叫地主，重新发牌"); initGame(); return; }
            trackTimeout(becomeLandlord, 500);
        } else {
            GameState.currentPlayer = (GameState.currentPlayer + 1) % 3;
            broadcastFullState();
            processOnlineCallTurn();
        }
    }

    function processOnlinePlay(id) {
        if (GameState.phase !== 'playing') return;
        updatePlayStatusText(id);
        if (id === GameState.myIndex) {
            document.getElementById('controls').innerHTML =
                '<button id="playBtn" class="pixel-btn bg-green-500 min-w-[80px]" onclick="playCards()">出牌</button>' +
                '<button id="passBtn" class="pixel-btn bg-gray-500 min-w-[80px]" onclick="passTurn()">不出</button>';
            let playBtn = document.getElementById('playBtn'), passBtn = document.getElementById('passBtn');
            if (playBtn) playBtn.disabled = (GameState.selectedCards.size === 0);
            if (passBtn) passBtn.disabled = (!GameState.lastPlay || GameState.lastPlayerId === GameState.myIndex);
            startOnlineTimer(15, () => {
                if (GameState.phase === 'playing' && GameState.currentPlayer === GameState.myIndex) {
                    if (GameState.lastPlay && GameState.lastPlayerId !== GameState.myIndex) sendAction({ type: 'pass' });
                    else {
                        let hand = GameState.players[GameState.myIndex];
                        if (hand && hand.length > 0) sendAction({ type: 'play', cards: [hand[0]] });
                    }
                }
            }, id);
        } else {
            document.getElementById('controls').innerHTML = '<button class="pixel-btn bg-gray-600" disabled>等待出牌</button>';
            startOnlineTimer(15, null, id);
        }
    }
    function renderUI() {
        renderPlayerHand();
        updateOpponentCount((GameState.myIndex + 1) % 3);
        updateOpponentCount((GameState.myIndex + 2) % 3);
        document.getElementById('scoreDisplay').innerHTML = `底分: ${GameState.baseScore}${GameState.bombCount>0?` ×${Math.pow(2,GameState.bombCount)}`:''}`;
        let area = document.getElementById('playArea');
        if (bottomCardsShown && GameState.lordCards && GameState.lordCards.length > 0) {
            // 保持底牌显示
        } else if (GameState.lastPlay && GameState.lastPlay.cards && GameState.lastPlay.cards.length > 0) {
            area.innerHTML = '';
            GameState.lastPlay.cards.forEach(c=>{
                let d=document.createElement('div'); d.className=`card w-10 h-14 text-[8px] flex flex-col items-center justify-center bg-white border ${c.suit==='♥'||c.suit==='♦'?'text-red-500':'text-black'}`;
                d.innerHTML=`<div>${c.suit}</div><div>${c.rank}</div>`; area.appendChild(d);
            });
            if ((GameState.lastPlay.type === CardType.BOMB || GameState.lastPlay.type === CardType.ROCKET) && (prevLastPlayId !== GameState.lastPlayerId || prevLastPlayType !== GameState.lastPlay.type)) {
                triggerBombFlash();
            }
            prevLastPlayId = GameState.lastPlayerId;
            prevLastPlayType = GameState.lastPlay.type;
            bottomCardsShown = false;
        } else {
            area.innerHTML = '<span class="text-gray-500 text-[10px]">等待出牌...</span>';
            prevLastPlayId = -1;
            prevLastPlayType = null;
            bottomCardsShown = false;
        }
        document.getElementById('coins').textContent = GameState.coins;
    }

    function startOnlineTimer(seconds, onTimeout, playerId) {
        clearTimer();
        timerTotalSeconds = seconds; // 记录总时间
        remainingSeconds = seconds;
        timerTarget = onTimeout;
        timerPlayerId = playerId !== undefined ? playerId : GameState.currentPlayer;
        timerInterval = setInterval(() => {
            if (remainingSeconds <= 0) { clearTimer(); if (timerTarget) timerTarget(); }
            else { remainingSeconds--; updateTimerBars(); }
        }, 1000);
        updateTimerBars();
    }
    function clearTimer() {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        timerTarget = null;
        document.getElementById('playerTimerBar').style.display = 'none';
        document.getElementById('playerTimerFill').style.width = '0';
        document.getElementById('leftTimerFill').style.width = '0';
        document.getElementById('rightTimerFill').style.width = '0';
    }
    function updateTimerBars() {
        let pct = (remainingSeconds / timerTotalSeconds) * 100; // 动态计算百分比
        if (pct > 100) pct = 100; 
        let myIdx = GameState.myIndex;
        let leftIdx = (myIdx + 1) % 3;
        let rightIdx = (myIdx + 2) % 3;
        
        document.getElementById('playerTimerBar').style.display = 'none';
        document.getElementById('leftTimerFill').style.width = '0';
        document.getElementById('rightTimerFill').style.width = '0';

        if (timerPlayerId === myIdx) {
            document.getElementById('playerTimerBar').style.display = 'block';
            document.getElementById('playerTimerFill').style.width = pct + '%';
        } else if (timerPlayerId === leftIdx) {
            document.getElementById('leftTimerFill').style.width = pct + '%';
        } else if (timerPlayerId === rightIdx) {
            document.getElementById('rightTimerFill').style.width = pct + '%';
        }
    }

    function handleDisconnect(dcIdx) {
        if (GameState.phase === 'gameover') return;
        showToast(`${getPlayerName(dcIdx)}掉线，AI将自动接管`);
        let disconnectedPlayer = dcIdx;
        if (GameState.myRole === 'host' && (GameState.phase === 'calling' || GameState.phase === 'playing')) {
            let ai = new MasterAI(disconnectedPlayer, GameState.difficulty, GameState.cardMemory || new MasterMemory());
            if (GameState.phase === 'calling' && GameState.currentPlayer === disconnectedPlayer) {
                let score = ai.think('call', GameState);
                executeCall(disconnectedPlayer, score);
                broadcastFullState();
            } else if (GameState.phase === 'playing' && GameState.currentPlayer === disconnectedPlayer) {
                let cards = ai.think('play', GameState);
                if (cards && cards.length > 0) {
                    let isValid = cards.every(c => GameState.players[disconnectedPlayer].includes(c));
                    let typeValid = getCardType(cards) !== null;
                    if (isValid && typeValid) { executePlayCards(disconnectedPlayer, cards); return; }
                }
                executePlayCards(disconnectedPlayer, []);
            } else {
                broadcastFullState();
            }
        }
    }

    function endGame(winner) {
        if (GameState.phase === 'gameover') return;
        GameState.phase = 'gameover';
        clearTimer();
        let isPlayerWin = (GameState.mode === 'single')
            ? ((winner === GameState.myIndex) || (winner !== GameState.myIndex && GameState.landlord !== GameState.myIndex && winner !== GameState.landlord))
            : (winner === GameState.myIndex);
        let isLordWin = (winner === GameState.landlord);
        let multiplier = GameState.baseScore * Math.pow(2, GameState.bombCount);
        let isSpring = false, isAntiSpring = false;
        if (isLordWin && !GameState.farmerPlayed && GameState.firstPlayMade) isSpring = true;
        if (!isLordWin && GameState.lordPlayCount === 1 && GameState.firstPlayMade) isAntiSpring = true;
        if (isSpring) { multiplier *= 2; showToast('🌸 春天！ 倍数翻倍'); playSound('win'); }
        if (isAntiSpring) { multiplier *= 2; showToast('⚡ 反春天！ 倍数翻倍'); playSound('win'); }
        let amount = Math.min(100 * multiplier, 9999);
        let oldCoins = GameState.coins;
        if (isPlayerWin) { GameState.stats.win++; GameState.coins += amount; playSound('win'); }
        else { GameState.coins = Math.max(0, GameState.coins - amount); }
        let delta = GameState.coins - oldCoins;
        addMatchRecord(isPlayerWin ? 'win' : 'lose', multiplier, delta, GameState.coins);
        updateStats();
        let screen = document.getElementById('gameOverScreen'), title = document.getElementById('resultTitle'), content = document.getElementById('resultContent');
        screen.classList.remove('hidden');
        let remainingHtml = '<div style="margin-top:8px;border-top:1px solid #555;padding-top:6px;font-size:10px;color:#aaa;text-align:left;">';
        for (let i = 0; i < 3; i++) {
            let name = getPlayerName(i);
            let role = i === GameState.landlord ? '(地主)' : '(农民)';
            let cards = formatRemainingCards(i);
            remainingHtml += name + role + ': ' + cards + '<br>';
        }
        remainingHtml += '</div>';
        if (isPlayerWin) {
            title.textContent = '🎉 胜利！'; title.className = 'text-xl retro-text mb-4 text-yellow-400 text-center';
            content.innerHTML = `赢得 ${amount} 筹码<br>余额：${GameState.coins}${isSpring?'<br>🌸春天加成':''}${isAntiSpring?'<br>⚡反春天加成':''}${remainingHtml}`;
        } else {
            title.textContent = '💔 失败'; title.className = 'text-xl retro-text mb-4 text-gray-400 text-center';
            content.innerHTML = `失去 ${amount} 筹码<br>余额：${GameState.coins}${remainingHtml}`;
        }
        addHistory(isPlayerWin ? '🎉胜利！' : '💔失败');
        GameState.processing = false;
        const playBtn = document.getElementById('playBtn');
        const passBtn = document.getElementById('passBtn');
        if (playBtn) playBtn.disabled = true;
        if (passBtn) passBtn.disabled = true;
        if (GameState.mode === 'online' && GameState.myRole === 'host') broadcastFullState();
        bottomCardsShown = false;
    }
    function resetGame() {
        gameTimeouts.forEach(id => clearTimeout(id));
        gameTimeouts = [];
        if (dealInterval) { clearInterval(dealInterval); dealInterval = null; }
        if (callTimeout) clearTimeout(callTimeout);
        clearTimer();
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        document.getElementById('gameOverScreen').classList.add('hidden');
        document.getElementById('playArea').innerHTML = '<span class="text-gray-500 text-[10px]">等待出牌...</span>';
        document.getElementById('lastPlayer').textContent = '';
        document.getElementById('scoreDisplay').textContent = '底分: 1';
        GameState.selectedCards.clear();
        bottomCardsShown = false;
        playLog = [];
        let actionEl = document.getElementById('actionLog');
        if (actionEl) actionEl.textContent = '';
        prevLastPlayId = -1;
        prevLastPlayType = null;
        if (GameState.mode === 'online' && GameState.myRole !== 'host') {
            document.getElementById('controls').innerHTML = '<p class="text-gray-400 text-[10px]">等待房主开始新对局…</p>';
            showToast("等待房主开始新游戏");
        } else {
            document.getElementById('controls').innerHTML =
                '<button id="callBtn" class="pixel-btn bg-green-500 text-[10px]" onclick="callScore(0)">不叫</button>' +
                '<button id="oneBtn" class="pixel-btn bg-blue-500 text-[10px]" onclick="callScore(1)">1分</button>' +
                '<button id="twoBtn" class="pixel-btn bg-yellow-500 text-[10px]" onclick="callScore(2)">2分</button>' +
                '<button id="threeBtn" class="pixel-btn bg-red-500 text-[10px]" onclick="callScore(3)">3分</button>';
            initGame();
        }
    }
    window.addEventListener('resize', ()=>{ if(GameState.players[GameState.myIndex]?.length) renderPlayerHand(); });
    window.onload = () => {
        loadHistory();
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            selectedVoice = getChineseVoice();
        }
    };
    window.onbeforeunload = () => { saveHistory(); };
</script>
</body>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      console.log('Service Worker 注册成功，作用域:', reg.scope);
    }).catch(err => {
      console.error('Service Worker 注册失败:', err);
    });
  }
</script>
</html>
